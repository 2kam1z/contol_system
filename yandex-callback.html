<!doctype html>
<html lang="ru" data-bs-theme="auto">
  <head>
    <script src="./dist/js/color-modes.js"></script>
    <script src="./dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Завершение входа через Яндекс ID">
    <title>Завершение входа - Система контроля процессов</title>

    <link href="./dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./dist/css/style2.css?v=1" rel="stylesheet">
    <link href="./dist/css/headers.css" rel="stylesheet">
    <link href="./dist/css/navbar-fixed.css" rel="stylesheet">
    <link href="./dist/css/font.css" rel="stylesheet">
    <link href="./dist/css/bootstrap-icons.css" rel="stylesheet">
    <link href="./dist/css/oauth-login.css?v=2" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" aria-label="Основная навигация">
        <div class="container-fluid">
          <div class="me-2">
            <a class="mk-brend img-fluid" href="index.html">
              <img src="./dist/img/logo.svg" alt="Система контроля процессов">
            </a>
          </div>
        </div>
      </nav>
    </header>

    <main class="mk-auth-shell">
      <section class="mk-auth-card" aria-labelledby="callbackTitle">
        <img class="mk-auth-brand" src="./dist/img/logo.svg" alt="Система контроля процессов">
        <div class="mk-auth-progress" aria-hidden="true">
          <span class="spinner-border spinner-border-sm"></span>
        </div>
        <h1 id="callbackTitle" class="mk-auth-title mk-bold">Завершаем вход</h1>
        <p class="mk-auth-status text-body-secondary small mb-0" data-yandex-callback-status>
          Получаем код авторизации от Яндекс ID.
        </p>
        <a class="btn btn-sm btn-outline-secondary d-none" href="login.html" data-yandex-callback-retry>
          Вернуться ко входу
        </a>
      </section>
    </main>

    <script src="./dist/js/yandex-callback.js?v=1"></script>
  </body>
</html>

<!doctype html>
<html lang="ru" data-bs-theme="auto">
  <head>
    <script src="./dist/js/color-modes.js"></script>
    <script src="./dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Вход в систему контроля процессов">
    <title>Вход - Система контроля процессов</title>

    <link href="./dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="./dist/css/style2.css?v=1" rel="stylesheet">
    <link href="./dist/css/headers.css" rel="stylesheet">
    <link href="./dist/css/navbar-fixed.css" rel="stylesheet">
    <link href="./dist/css/font.css" rel="stylesheet">
    <link href="./dist/css/bootstrap-icons.css" rel="stylesheet">
    <link href="./dist/css/oauth-login.css?v=1" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" aria-label="Основная навигация">
        <div class="container-fluid">
          <div class="me-2">
            <a class="mk-brend img-fluid" href="index.html">
              <img src="./dist/img/logo.svg" alt="Система контроля процессов">
            </a>
          </div>
        </div>
      </nav>
    </header>

    <main class="mk-auth-shell">
      <section class="mk-auth-card" aria-labelledby="authTitle">
        <img class="mk-auth-brand" src="./dist/img/logo.svg" alt="Система контроля процессов">
        <h1 id="authTitle" class="mk-auth-title mk-bold">Вход</h1>

        <button
          type="button"
          class="mk-yandex-login-button"
          data-yandex-login
          data-auth-url="/auth/yandex/url"
        >
          <span class="mk-yandex-login-icon" aria-hidden="true">Я</span>
          <span>Войти с Яндекс ID</span>
        </button>

        <p class="mk-auth-status text-body-secondary small mt-3 mb-0" data-auth-status></p>
      </section>
    </main>

    <script src="./dist/js/oauth-login.js?v=1"></script>
  </body>
</html>
